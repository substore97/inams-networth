name: Build INAMS NETWORTH APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Repository ki files dikhao
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find . -maxdepth 3 -not -path "./.git*" -type f | head -50

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android project tayyar karo
        run: |
          mkdir -p android && cd android
          echo "" | base64 -d | tar xz
          HTML=$(find .. -maxdepth 3 -not -path "../android/*" -iname "*.html" | head -n 1)
          if [ -z "$HTML" ]; then echo "HTML file nahi mili - repository me app ki .html file upload karein"; exit 1; fi
          mkdir -p app/src/main/assets
          cp "$HTML" app/src/main/assets/index.html
          echo "App file: $HTML"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: APK banao
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK ka naam theek karo
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/INAMS-NETWORTH-v${{ github.run_number }}.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: INAMS-NETWORTH-APK
          path: out/*.apk
